AWSTemplateFormatVersion: '2010-09-09'
Description: >
  DynamoDB table holding the government soil-nutrient survey, aggregated to district,
  block and village level, so the fertilizer tool can infer a farmer's soil condition
  from their location instead of asking them for a soil test.

Parameters:
  TableName:
    Type: String
    Default: Agromemnon-soil-nutrients
    Description: Must match the SOIL_NUTRIENTS_TABLE env var on the agent runtime.

Resources:
  SoilNutrientsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref TableName
      # The survey is reloaded in bulk a couple of times a year and read a handful of
      # times per conversation, so there is no steady throughput to provision for.
      BillingMode: PAY_PER_REQUEST
      # pk = "<state>#<granularity>#<place path>", sk = "<survey year>".
      # The year alone is the sort key so querying a place backwards yields the most
      # recent survey first, without needing to know which years exist.
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      Tags:
        - Key: agentcore:project-name
          Value: Agromemnon

Outputs:
  SoilNutrientsTableName:
    Description: Table name to set as SOIL_NUTRIENTS_TABLE on the runtime.
    Value: !Ref SoilNutrientsTable
  SoilNutrientsTableArn:
    Value: !GetAtt SoilNutrientsTable.Arn
